<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C16"/>
      <stop offset="100%" stop-color="#11223F"/>
    </linearGradient>
    <linearGradient id="satGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#bg8)" rx="16"/>

  <g transform="translate(45, 35)">
    <rect width="510" height="310" rx="12" fill="#080F1E" stroke="#1E293B" stroke-width="2"/>

    <!-- Header bar -->
    <rect width="510" height="38" rx="12" fill="#0F172A"/>
    <rect y="26" width="510" height="12" fill="#0F172A"/>
    <circle cx="20" cy="19" r="4" fill="#38BDF8"/>
    <text x="34" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Installation Satellite &amp; Starlink Haute Performance</text>
    <text x="375" y="23" font-family="'Fira Code', monospace" font-size="10" fill="#22C55E">● CONNECTÉ 220 Mbps</text>

    <!-- Starlink Dish Visual -->
    <g transform="translate(40, 60)">
      <!-- Stars in space backdrop -->
      <circle cx="40" cy="20" r="1" fill="#FFFFFF" opacity="0.8"/>
      <circle cx="120" cy="15" r="1.5" fill="#FFFFFF" opacity="0.7"/>
      <circle cx="180" cy="40" r="1" fill="#FFFFFF" opacity="0.9"/>
      <circle cx="20" cy="80" r="1" fill="#FFFFFF" opacity="0.5"/>

      <!-- Satellite signals waves -->
      <path d="M 120 40 A 50 50 0 0 1 170 90" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.8"/>
      <path d="M 135 30 A 70 70 0 0 1 205 100" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5"/>
      <path d="M 150 20 A 90 90 0 0 1 240 110" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.3"/>

      <!-- Starlink Dish Rectangular phased array -->
      <g transform="translate(70, 70) rotate(-22)">
        <!-- Dish face -->
        <rect x="0" y="0" width="100" height="60" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
        <line x1="20" y1="0" x2="20" y2="60" stroke="#E2E8F0" stroke-width="1"/>
        <line x1="50" y1="0" x2="50" y2="60" stroke="#E2E8F0" stroke-width="1"/>
        <line x1="80" y1="0" x2="80" y2="60" stroke="#E2E8F0" stroke-width="1"/>
        <!-- Mast / Stem -->
        <rect x="42" y="60" width="16" height="55" rx="3" fill="#64748B"/>
        <!-- Heavy duty Roof Mount Bracket -->
        <polygon points="20,115 80,115 95,135 5,135" fill="#334155"/>
      </g>

      <!-- Roof Line -->
      <line x1="10" y1="210" x2="210" y2="210" stroke="#475569" stroke-width="4"/>
      <!-- Cabling down -->
      <path d="M 125 185 L 125 210 L 220 210" fill="none" stroke="#38BDF8" stroke-width="2.5"/>
    </g>

    <!-- Starlink App Metrics Panel -->
    <g transform="translate(260, 55)">
      <rect width="230" height="230" rx="10" fill="#0C1527" stroke="#1E293B" stroke-width="1.2"/>
      <text x="20" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Statut &amp; Mesures de Débit</text>
      
      <!-- Metrics Boxes -->
      <rect x="20" y="45" width="90" height="55" rx="6" fill="#13223D"/>
      <text x="30" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94A3B8">Download</text>
      <text x="30" y="88" font-family="'Fira Code', monospace" font-size="15" font-weight="bold" fill="#38BDF8">228 <tspan font-size="9">Mbps</tspan></text>

      <rect x="120" y="45" width="90" height="55" rx="6" fill="#13223D"/>
      <text x="130" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94A3B8">Upload</text>
      <text x="130" y="88" font-family="'Fira Code', monospace" font-size="15" font-weight="bold" fill="#10B981">28.4 <tspan font-size="9">Mbps</tspan></text>

      <rect x="20" y="110" width="190" height="40" rx="6" fill="#13223D"/>
      <text x="30" y="126" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94A3B8">Latence moyenne (Ping)</text>
      <text x="30" y="142" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#22C55E">29 ms • Zéro Obstruction</text>

      <!-- Checklist details -->
      <text x="20" y="175" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#E2E8F0">✓ Fixation toiture sécurisée anti-vent</text>
      <text x="20" y="193" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#E2E8F0">✓ Câblage étanche &amp; traversée murale propre</text>
      <text x="20" y="211" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#E2E8F0">✓ Routeur WiFi Mesh paramétré</text>
    </g>
  </g>
</svg>
