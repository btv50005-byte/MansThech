<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="mansAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#bg2)" rx="16"/>

  <!-- Grid lines -->
  <g opacity="0.1" stroke="#38BDF8" stroke-width="1">
    <line x1="0" y1="95" x2="600" y2="95"/>
    <line x1="0" y1="190" x2="600" y2="190"/>
    <line x1="0" y1="285" x2="600" y2="285"/>
    <line x1="150" y1="0" x2="150" y2="380"/>
    <line x1="300" y1="0" x2="300" y2="380"/>
    <line x1="450" y1="0" x2="450" y2="380"/>
  </g>

  <!-- Laptop / Screen Frame -->
  <g transform="translate(70, 40)">
    <rect width="460" height="270" rx="10" fill="#0A0E17" stroke="#334155" stroke-width="2"/>
    
    <!-- Top Header of the site -->
    <rect width="460" height="40" rx="10" fill="#131C2E"/>
    <rect y="28" width="460" height="12" fill="#131C2E"/>

    <!-- Logo placeholder in mockup -->
    <circle cx="28" cy="20" r="10" fill="#00E5FF"/>
    <text x="46" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" fill="#FFFFFF">MANS ÉLECTRONIQUE</text>
    
    <!-- Nav items -->
    <text x="240" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94A3B8">Accueil</text>
    <text x="290" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94A3B8">Services</text>
    <text x="345" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94A3B8">Contact</text>
    <rect x="395" y="11" width="50" height="18" rx="4" fill="#0070F3"/>
    <text x="403" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF">Devis</text>

    <!-- Hero banner inside mockup -->
    <rect x="20" y="55" width="420" height="95" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <text x="35" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">MANS ÉLECTRONIQUE</text>
    <text x="35" y="103" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#38BDF8">« Votre partenaire de confiance »</text>
    <text x="35" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94A3B8">Réparation • Informatique • Réseaux • Climatisation • Saint-Louis</text>

    <!-- 3 Service Cards inside mockup -->
    <rect x="20" y="165" width="130" height="85" rx="6" fill="#151E33" stroke="#1E293B" stroke-width="1"/>
    <text x="30" y="188" font-size="16">🔧</text>
    <text x="30" y="208" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">Électronique</text>
    <text x="30" y="222" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#94A3B8">Dépannage &amp; Composants</text>

    <rect x="165" y="165" width="130" height="85" rx="6" fill="#151E33" stroke="#1E293B" stroke-width="1"/>
    <text x="175" y="188" font-size="16">🎮</text>
    <text x="175" y="208" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">Consoles</text>
    <text x="175" y="222" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#94A3B8">PlayStation &amp; Solutions</text>

    <rect x="310" y="165" width="130" height="85" rx="6" fill="#151E33" stroke="#1E293B" stroke-width="1"/>
    <text x="320" y="188" font-size="16">📹</text>
    <text x="320" y="208" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">Surveillance</text>
    <text x="320" y="222" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#94A3B8">Caméras &amp; Sécurité IP</text>
  </g>
  <!-- Laptop base -->
  <polygon points="120,320 480,320 510,335 90,335" fill="#1E293B"/>
  <rect x="270" y="325" width="60" height="4" rx="2" fill="#475569"/>
</svg>
