<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glowAvatar">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle with Neon Border -->
  <circle cx="200" cy="200" r="190" fill="url(#avatarBg)" stroke="url(#ringGrad)" stroke-width="4" filter="url(#glowAvatar)"/>
  
  <!-- Subtle Circuit overlay -->
  <g opacity="0.15" stroke="#38BDF8" stroke-width="1.5">
    <circle cx="200" cy="200" r="150" fill="none" stroke-dasharray="6,6"/>
    <line x1="50" y1="200" x2="350" y2="200"/>
    <line x1="200" y1="50" x2="200" y2="350"/>
  </g>

  <!-- Stylized Tech Professional Silhouette -->
  <!-- Shoulders / Suit jacket -->
  <path d="M 90 350 C 90 280 140 250 200 250 C 260 250 310 280 310 350 Z" fill="#0A0F1D" stroke="#38BDF8" stroke-width="2"/>
  <path d="M 160 250 L 200 290 L 240 250 Z" fill="#1E293B"/>
  
  <!-- Neck -->
  <rect x="180" y="210" width="40" height="45" rx="6" fill="#D97706" opacity="0.2"/>

  <!-- Head -->
  <circle cx="200" cy="165" r="55" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>

  <!-- Badge / Camera Overlay icon -->
  <g transform="translate(160, 130)">
    <rect width="80" height="55" rx="10" fill="#0070F3" opacity="0.85"/>
    <circle cx="40" cy="27" r="14" fill="#0A0E17"/>
    <circle cx="40" cy="27" r="8" fill="#00E5FF"/>
    <circle cx="58" cy="16" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Instructional Badge -->
  <g transform="translate(60, 310)">
    <rect width="280" height="42" rx="21" fill="#030712" stroke="#00E5FF" stroke-width="1.5"/>
    <text x="140" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Mouhamadou Mansour Seck</text>
    <text x="140" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#38BDF8" text-anchor="middle">📷 Emplacement Photo Personnelle</text>
  </g>
</svg>
