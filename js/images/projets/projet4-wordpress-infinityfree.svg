<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1A2F"/>
      <stop offset="100%" stop-color="#142646"/>
    </linearGradient>
    <linearGradient id="wpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#21759B"/>
      <stop offset="100%" stop-color="#00A0D2"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#bg4)" rx="16"/>

  <g transform="translate(50, 40)">
