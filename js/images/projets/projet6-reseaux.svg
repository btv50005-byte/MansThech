<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1128"/>
      <stop offset="100%" stop-color="#001F54"/>
    </linearGradient>
    <linearGradient id="netGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#bg6)" rx="16"/>

  <!-- Network Topology Diagram -->
  <g transform="translate(40, 35)">
    <!-- Main Frame -->
    <rect width="520" height="310" rx="12" fill="#070D1B" stroke="#1E293B" stroke-width="2"/>

    <!-- Title Bar -->
    <rect width="520" height="36" rx="12" fill="#0F172A"/>
    <rect y="24" width="520" height="12" fill="#0F172A"/>
    <circle cx="20" cy="18" r="4" fill="#00E5FF"/>
    <text x="34" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Architecture Réseau LAN / WAN &amp; Routage</text>
    <text x="350" y="22" font-family="'Fira Code', monospace" font-size="10" fill="#38BDF8">VLAN • DHCP • DNS • RJ45</text>

    <!-- Top: Internet / WAN Cloud -->
    <g transform="translate(210, 48)">
      <rect width="100" height="42" rx="20" fill="#1E293B" stroke="#00E5FF" stroke-width="1.5"/>
      <text x="26" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">WAN / FAI</text>
    </g>

    <!-- Cable WAN to Router -->
    <line x1="260" y1="90" x2="260" y2="115" stroke="#00E5FF" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Router -->
    <g transform="translate(190, 115)">
      <rect width="140" height="45" rx="8" fill="#13203A" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="18" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Routeur Passerelle</text>
      <circle cx="120" cy="18" r="3" fill="#22C55E"/>
      <circle cx="120" cy="28" r="3" fill="#00E5FF"/>
    </g>

    <!-- Cable Router to Switch -->
    <line x1="260" y1="160" x2="260" y2="185" stroke="#38BDF8" stroke-width="2.5"/>

    <!-- Switch Gigabit 24 Ports -->
    <g transform="translate(140, 185)">
      <rect width="240" height="42" rx="6" fill="#0F172A" stroke="#2563EB" stroke-width="1.5"/>
      <text x="14" y="25" font-family="'Fira Code', monospace" font-size="10" font-weight="bold" fill="#60A5FA">Switch 24p Gigabit</text>
      <!-- RJ45 Port lights -->
      <circle cx="140" cy="21" r="2.5" fill="#22C55E"/>
      <circle cx="150" cy="21" r="2.5" fill="#22C55E"/>
      <circle cx="160" cy="21" r="2.5" fill="#22C55E"/>
      <circle cx="170" cy="21" r="2.5" fill="#22C55E"/>
      <circle cx="180" cy="21" r="2.5" fill="#EAB308"/>
      <circle cx="190" cy="21" r="2.5" fill="#22C55E"/>
      <circle cx="200" cy="21" r="2.5" fill="#22C55E"/>
      <circle cx="210" cy="21" r="2.5" fill="#22C55E"/>
      <circle cx="220" cy="21" r="2.5" fill="#22C55E"/>
    </g>

    <!-- RJ45 Cables to clients -->
    <line x1="180" y1="227" x2="90" y2="252" stroke="#60A5FA" stroke-width="1.5"/>
    <line x1="230" y1="227" x2="200" y2="252" stroke="#60A5FA" stroke-width="1.5"/>
    <line x1="290" y1="227" x2="320" y2="252" stroke="#60A5FA" stroke-width="1.5"/>
    <line x1="340" y1="227" x2="430" y2="252" stroke="#60A5FA" stroke-width="1.5"/>

    <!-- End Devices -->
    <!-- PC Postes -->
    <g transform="translate(30, 252)">
      <rect width="115" height="42" rx="6" fill="#152037" stroke="#334155" stroke-width="1"/>
      <text x="8" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">💻 Postes PC Client</text>
      <text x="8" y="32" font-family="'Fira Code', monospace" font-size="8" fill="#38BDF8">DHCP : 192.168.1.50</text>
    </g>

    <!-- Point d'accès WiFi -->
    <g transform="translate(155, 252)">
      <rect width="105" height="42" rx="6" fill="#152037" stroke="#334155" stroke-width="1"/>
      <text x="8" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">📡 Point d'accès WiFi</text>
      <text x="8" y="32" font-family="'Fira Code', monospace" font-size="8" fill="#38BDF8">SSID / WPA3 Sécurisé</text>
    </g>

    <!-- Serveur NAS / NVR -->
    <g transform="translate(270, 252)">
      <rect width="110" height="42" rx="6" fill="#152037" stroke="#334155" stroke-width="1"/>
      <text x="8" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">🗄️ Serveur / NVR</text>
      <text x="8" y="32" font-family="'Fira Code', monospace" font-size="8" fill="#38BDF8">IP Fixe : 192.168.1.10</text>
    </g>

    <!-- Imprimante Réseau -->
    <g transform="translate(390, 252)">
      <rect width="105" height="42" rx="6" fill="#152037" stroke="#334155" stroke-width="1"/>
      <text x="8" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">🖨️ Périphérique</text>
      <text x="8" y="32" font-family="'Fira Code', monospace" font-size="8" fill="#38BDF8">Partage LAN IP</text>
    </g>
  </g>
</svg>
