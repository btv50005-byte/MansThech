<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#14192B"/>
    </linearGradient>
    <linearGradient id="psGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003791"/>
      <stop offset="100%" stop-color="#0072CE"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#bg7)" rx="16"/>

  <g transform="translate(50, 40)">
    <!-- Main Workbench Area -->
    <rect width="500" height="300" rx="12" fill="#070C18" stroke="#1E293B" stroke-width="2"/>

    <!-- Header bar -->
    <rect width="500" height="40" rx="12" fill="#0F172A"/>
    <rect y="28" width="500" height="12" fill="#0F172A"/>
    <!-- PlayStation action buttons symbols -->
    <text x="25" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#0072CE">▲</text>
    <text x="45" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#EF4444">●</text>
    <text x="65" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#3B82F6">✖</text>
    <text x="85" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#EC4899">■</text>
    <text x="120" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Diagnostic &amp; Réparation Hardware Consoles PlayStation</text>

    <!-- Console Illustration & Disassembly -->
    <g transform="translate(30, 60)">
      <!-- Console Base Body -->
      <rect x="15" y="20" width="180" height="180" rx="14" fill="#0A0E17" stroke="#0072CE" stroke-width="2"/>
      
      <!-- Internal Motherboard view -->
      <rect x="30" y="35" width="150" height="150" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
      <!-- APU / Chip -->
      <rect x="80" y="85" width="50" height="50" rx="4" fill="#1E293B" stroke="#94A3B8" stroke-width="1"/>
      <text x="92" y="112" font-family="'Fira Code', monospace" font-size="9" fill="#00E5FF">APU</text>
      <text x="84" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#10B981">Pâte Thermique</text>

      <!-- Fan / Cooling -->
      <circle cx="55" cy="65" r="20" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
      <line x1="55" y1="47" x2="55" y2="83" stroke="#38BDF8" stroke-width="1.5"/>
      <line x1="37" y1="65" x2="73" y2="65" stroke="#38BDF8" stroke-width="1.5"/>
      <line x1="42" y1="52" x2="68" y2="78" stroke="#38BDF8" stroke-width="1.5"/>
      <line x1="42" y1="78" x2="68" y2="52" stroke="#38BDF8" stroke-width="1.5"/>

      <!-- HDMI Port highlighted -->
      <rect x="90" y="180" width="30" height="12" fill="#EAB308" stroke="#CA8A04" stroke-width="1"/>
      <text x="93" y="189" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="bold" fill="#000000">HDMI</text>
    </g>

    <!-- Checklist & Diagnostics Cards -->
    <g transform="translate(250, 60)">
      <rect width="220" height="210" rx="8" fill="#111B2F" stroke="#2563EB" stroke-width="1"/>
      <text x="18" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Protocole Technique Réalisé</text>
      
      <g transform="translate(18, 48)">
        <circle cx="6" cy="6" r="6" fill="#10B981"/>
        <text x="20" y="10" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#E2E8F0">Remplacement port HDMI</text>
      </g>
      
      <g transform="translate(18, 80)">
        <circle cx="6" cy="6" r="6" fill="#10B981"/>
        <text x="20" y="10" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#E2E8F0">Nettoyage &amp; Pâte thermique MX-4</text>
      </g>

      <g transform="translate(18, 112)">
        <circle cx="6" cy="6" r="6" fill="#10B981"/>
        <text x="20" y="10" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#E2E8F0">Diagnostic alimentation &amp; fusibles</text>
      </g>

      <g transform="translate(18, 144)">
        <circle cx="6" cy="6" r="6" fill="#10B981"/>
        <text x="20" y="10" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#E2E8F0">Mise à jour système &amp; Stockage SSD</text>
      </g>

      <g transform="translate(18, 176)">
        <rect width="184" height="22" rx="4" fill="#0284C7" opacity="0.9"/>
        <text x="14" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">✓ Tests thermiques &amp; Stress validés</text>
      </g>
    </g>
  </g>
</svg>
