<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0070F3"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" fill="url(#bg1)" rx="16"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="380"/>
    <line x1="200" y1="0" x2="200" y2="380"/>
    <line x1="300" y1="0" x2="300" y2="380"/>
    <line x1="400" y1="0" x2="400" y2="380"/>
    <line x1="500" y1="0" x2="500" y2="380"/>
  </g>

  <!-- Mockup Window Browser -->
  <g transform="translate(60, 45)">
    <!-- Browser Frame -->
    <rect width="480" height="290" rx="12" fill="#0A0E17" stroke="#1E293B" stroke-width="2"/>
    
    <!-- Title bar -->
    <rect width="480" height="36" rx="12" fill="#131C2E"/>
    <rect y="24" width="480" height="12" fill="#131C2E"/>
    
    <!-- Window Dots -->
    <circle cx="20" cy="18" r="5" fill="#EF4444"/>
    <circle cx="36" cy="18" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="18" r="5" fill="#10B981"/>

    <!-- URL Bar -->
    <rect x="80" y="8" width="300" height="20" rx="6" fill="#0A0E17"/>
    <text x="96" y="22" font-family="'Fira Code', monospace" font-size="10" fill="#64748B">https://mans-portfolio.dev</text>

    <!-- Content: Code & Layout UI -->
    <!-- Sidebar / Hero preview -->
    <rect x="25" y="55" width="200" height="90" rx="8" fill="#111A2E" stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.4"/>
    <text x="40" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Mouhamadou M. Seck</text>
    <text x="40" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#00E5FF">Portfolio Web Personnel</text>
    <rect x="40" y="112" width="70" height="18" rx="4" fill="#0070F3"/>
    <text x="48" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">Projets ➜</text>

    <!-- Code Block -->
    <rect x="240" y="55" width="215" height="210" rx="8" fill="#050811" stroke="#334155" stroke-width="1"/>
    <text x="255" y="80" font-family="'Fira Code', monospace" font-size="10" fill="#F43F5E">&lt;section <tspan fill="#38BDF8">class=</tspan><tspan fill="#FDE047">"hero"</tspan>&gt;</text>
    <text x="270" y="100" font-family="'Fira Code', monospace" font-size="10" fill="#E2E8F0">&lt;<tspan fill="#F43F5E">h1</tspan>&gt;<tspan fill="#FFFFFF">MANS ÉLECTRONIQUE</tspan>&lt;/<tspan fill="#F43F5E">h1</tspan>&gt;</text>
    <text x="270" y="120" font-family="'Fira Code', monospace" font-size="10" fill="#E2E8F0">&lt;<tspan fill="#F43F5E">p</tspan>&gt;HTML • CSS • JS&lt;/<tspan fill="#F43F5E">p</tspan>&gt;</text>
    <text x="255" y="140" font-family="'Fira Code', monospace" font-size="10" fill="#F43F5E">&lt;/section&gt;</text>
    <line x1="255" y1="155" x2="435" y2="155" stroke="#1E293B" stroke-width="1"/>
    <text x="255" y="175" font-family="'Fira Code', monospace" font-size="10" fill="#38BDF8">const <tspan fill="#FDE047">tech</tspan> = {</text>
    <text x="270" y="195" font-family="'Fira Code', monospace" font-size="10" fill="#CBD5E1">responsive: <tspan fill="#4ADE80">true</tspan>,</text>
    <text x="270" y="215" font-family="'Fira Code', monospace" font-size="10" fill="#CBD5E1">design: <tspan fill="#FDE047">"Moderne"</tspan></text>
    <text x="255" y="235" font-family="'Fira Code', monospace" font-size="10" fill="#38BDF8">};</text>

    <!-- Mini Cards in Browser -->
    <rect x="25" y="160" width="95" height="105" rx="6" fill="#152037" stroke="#1E293B" stroke-width="1"/>
    <circle cx="50" cy="185" r="14" fill="#00E5FF" opacity="0.2"/>
    <text x="44" y="190" font-size="12" fill="#00E5FF">⚡</text>
    <text x="35" y="215" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#FFFFFF">Électronique</text>
    <text x="35" y="230" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#94A3B8">Hardware</text>

    <rect x="130" y="160" width="95" height="105" rx="6" fill="#152037" stroke="#1E293B" stroke-width="1"/>
    <circle cx="155" cy="185" r="14" fill="#0070F3" opacity="0.2"/>
    <text x="149" y="190" font-size="12" fill="#0070F3">🌐</text>
    <text x="140" y="215" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#FFFFFF">Réseaux</text>
    <text x="140" y="230" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#94A3B8">LAN &amp; IP</text>
  </g>
</svg>
