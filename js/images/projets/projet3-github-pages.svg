<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="gitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2EA043"/>
      <stop offset="100%" stop-color="#56D364"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#bg3)" rx="16"/>

  <!-- Deployment Pipeline Visual -->
  <g transform="translate(50, 45)">
    <!-- GitHub Header Style -->
    <rect width="500" height="290" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
    
    <!-- Repo banner -->
    <rect width="500" height="48" rx="12" fill="#161B22"/>
    <rect y="36" width="500" height="12" fill="#161B22"/>
    <circle cx="28" cy="24" r="12" fill="#30363D"/>
    <!-- Git Branch icon -->
    <path d="M 24 20 A 3 3 0 1 1 27 23 L 27 27 A 3 3 0 1 1 24 29" stroke="#58A6FF" stroke-width="2" fill="none"/>
    <text x="50" y="28" font-family="'Fira Code', monospace" font-size="13" font-weight="bold" fill="#58A6FF">mansour-seck / portfolio-mans</text>
    <rect x="420" y="14" width="65" height="22" rx="6" fill="#21262D" stroke="#30363D" stroke-width="1"/>
    <text x="432" y="29" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#8B949E">Public</text>

    <!-- GitHub Pages status card -->
    <rect x="25" y="65" width="450" height="75" rx="8" fill="#161B22" stroke="#2EA043" stroke-width="1.5"/>
    <circle cx="48" cy="102" r="14" fill="#2EA043" opacity="0.2"/>
    <path d="M 42 102 L 46 106 L 54 98" fill="none" stroke="#3FB950" stroke-width="2.5" stroke-linecap="round"/>
    <text x="75" y="94" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">GitHub Pages : Déploiement actif</text>
    <text x="75" y="112" font-family="'Fira Code', monospace" font-size="10" fill="#7EE787">https://mansour-seck.github.io/portfolio-mans/</text>

    <!-- Terminal commands -->
    <rect x="25" y="155" width="450" height="110" rx="8" fill="#010409" stroke="#30363D" stroke-width="1"/>
    <text x="40" y="180" font-family="'Fira Code', monospace" font-size="11" fill="#8B949E">$ <tspan fill="#79C0FF">git</tspan> add .</text>
    <text x="40" y="202" font-family="'Fira Code', monospace" font-size="11" fill="#8B949E">$ <tspan fill="#79C0FF">git</tspan> commit -m <tspan fill="#A5D6FF">"Mise en ligne du portfolio MANS ÉLECTRONIQUE"</tspan></text>
    <text x="40" y="224" font-family="'Fira Code', monospace" font-size="11" fill="#8B949E">$ <tspan fill="#79C0FF">git</tspan> push origin main</text>
    <text x="40" y="246" font-family="'Fira Code', monospace" font-size="11" fill="#3FB950">✓ Synchronisé avec succès avec GitHub Pages (Environnement Live)</text>
  </g>
</svg>
