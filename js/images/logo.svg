<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#0070F3"/>
      <stop offset="100%" stop-color="#7928CA"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00DF89"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Icon Symbol: Circuit Tech Hexagon with 'M' -->
  <g transform="translate(15, 10)">
    <!-- Hexagon Border -->
    <polygon points="50,5 92,28 92,72 50,95 8,72 8,28" fill="#0E1626" stroke="url(#primaryGrad)" stroke-width="3.5" filter="url(#glow)"/>
    
    <!-- Circuit lines & nodes -->
    <circle cx="50" cy="5" r="3.5" fill="#00E5FF" />
    <circle cx="92" cy="50" r="3.5" fill="#0070F3" />
    <circle cx="50" cy="95" r="3.5" fill="#7928CA" />
    <circle cx="8" cy="50" r="3.5" fill="#00E5FF" />

    <line x1="28" y1="28" x2="20" y2="20" stroke="#00E5FF" stroke-width="2" stroke-linecap="round"/>
    <circle cx="20" cy="20" r="2.5" fill="#00E5FF"/>

    <line x1="72" y1="28" x2="80" y2="20" stroke="#0070F3" stroke-width="2" stroke-linecap="round"/>
    <circle cx="80" cy="20" r="2.5" fill="#0070F3"/>

    <!-- Dynamic Letter M -->
    <path d="M 28 70 L 28 35 L 50 56 L 72 35 L 72 70" fill="none" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Lightning / Pulse center node -->
    <circle cx="50" cy="56" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- Typography: MANS ÉLECTRONIQUE -->
  <g transform="translate(135, 20)">
    <text x="0" y="42" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="2">
      MANS <tspan fill="url(#primaryGrad)">ÉLECTRONIQUE</tspan>
    </text>
    <text x="2" y="70" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#94A3B8" letter-spacing="3.5">
      VOTRE PARTENAIRE DE CONFIANCE
    </text>

    <!-- Decorative accent line -->
    <line x1="2" y1="82" x2="360" y2="82" stroke="url(#primaryGrad)" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
    <circle cx="360" cy="82" r="3" fill="#00E5FF"/>
  </g>
</svg>
